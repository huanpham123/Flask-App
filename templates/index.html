<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text-to-Speech Tiếng Việt</title>
  <style>/* … giữ nguyên style … */</style>
</head>
<body>
  <h1>Text-to-Speech Tiếng Việt</h1>
  <textarea id="textInput" rows="5" placeholder="Nhập văn bản ..."></textarea><br>
  <button onclick="playTTS()">Phát âm thanh</button>
  <div id="loading" class="loading">Đang xử lý...</div>
  <audio id="audioPlayer" controls></audio>

  <script>
    async function playTTS() {
      const text = document.getElementById('textInput').value.trim();
      if (!text) { alert('Nhập văn bản đi bạn!'); return; }
      const player = document.getElementById('audioPlayer');
      const loading = document.getElementById('loading');
      loading.style.display = 'block';
      player.style.display = 'none';

      try {
        const resp = await fetch(`/api/tts?text=${encodeURIComponent(text)}`);
        if (!resp.ok) throw new Error(`Server lỗi: ${resp.status}`);
        const blob = await resp.blob();
        const url = URL.createObjectURL(blob);
        player.src = url;
        player.style.display = 'block';
        player.play();
      } catch (e) {
        alert(e.message);
      } finally {
        loading.style.display = 'none';
      }
    }

    document.getElementById('textInput').addEventListener('keypress', e => {
      if (e.key==='Enter' && !e.shiftKey) {
        e.preventDefault(); playTTS();
      }
    });
  </script>
</body>
</html>
